ccea:
  evaluation:
    multi_rollout:
      num_rollouts: 1
  mutation:
    independent_probability: 0.5
    mean: 0.0
    std_deviation: 0.1
  network:
    hidden_layers:
    - 15
    rover_max_velocity: 1.0
    uav_max_velocity: 1.0
  num_generations: 50000
  num_steps: 50
  populations:
    agent_population_size: 50
  selection:
    n_elites_binary_tournament:
      n_individual_elites: 10
      n_individual_elites_based_on_team_fitness: 0
      n_team_elites: 10
  team_formation:
    type: softmax_teams
  weight_initialization:
    lower_bound: -0.5
    upper_bound: 0.5
experiment:
  num_trials: 50
processing:
  num_threads: 15
  use_multiprocessing: true
data:
  checkpoints:
    delete_previous: true
    frequency: 1
    save: true
  save_trajectories:
    test:
      num_gens_between_save: 250
      switch: true
    train:
      num_gens_between_save: 100
      switch: false
debug:
  random_seed:
    increment_every_trial: true
    set_seed: null
  reward_equals_G: false
ccea:
  num_steps: 225
env:
  agents:
    rovers:
    - action:
        type: dxdy
      needs_uav_to_move: true
      observation_radius: 5.0
      policy:
        type: network
      position:
        fixed:
        - 5.0
        - 5.0
        spawn_rule: fixed
      resolution: 90
      reward_spec:
        reward_type: Global
      sensor:
        accum_type: sum
        type: RoverLidar
    uavs:
    - action:
        type: dxdy
      bounds:
        high_x: 20
        high_y: 20
